name: VideoFlow UI runtime smoke
on:
  push:
    branches: [videoflow-mobile]
    paths:
      - ".github/workflows/videoflow-ui-smoke.yml"
      - "app/src/main/java/com/asterion/videoflow/MainActivity.kt"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Build emulator APK
        run: gradle :app:assembleDebug -PuiSmoke=true --no-daemon --console=plain
      - name: Allow hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0660", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch and capture screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: python3 .github/scripts/videoflow_ui_smoke.py
      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: videoflow-ui-smoke-screens
          path: |
            ui-*.png
            crash.log
          if-no-files-found: warn
          retention-days: 7
