name: VideoFlow UI runtime smoke
on:
  push:
    branches: [videoflow-mobile]
    paths:
      - ".github/workflows/videoflow-ui-smoke.yml"
      - "app/src/main/java/com/asterion/videoflow/MainActivity.kt"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Build emulator APK
        run: gradle :app:assembleDebug -PuiSmoke=true --no-daemon --console=plain
      - name: Allow hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0660", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch and capture screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -W -n com.asterion.videoflow/.MainActivity
            sleep 5
            adb exec-out screencap -p > ui-home.png
            tap_text() {
              adb shell uiautomator dump /sdcard/window.xml >/dev/null
              adb pull /sdcard/window.xml window.xml >/dev/null
              coords=$(python3 -c 'import sys,xml.etree.ElementTree as ET,re; x=ET.parse("window.xml"); n=next((e for e in x.iter("node") if e.attrib.get("text")==sys.argv[1]),None); assert n is not None, "Control not found: "+sys.argv[1]; v=list(map(int,re.findall(r"\d+",n.attrib["bounds"]))); print((v[0]+v[2])//2,(v[1]+v[3])//2)' "$1")
              adb shell input tap $coords
              sleep 2
            }
            tap_text "Models"
            adb exec-out screencap -p > ui-models.png
            tap_text "FOLLOW PERFORMER"
            adb exec-out screencap -p > ui-performer-dialog.png
            adb shell input keyevent 4
            tap_text "Downloads"
            adb exec-out screencap -p > ui-downloads.png
            tap_text "Sources"
            adb exec-out screencap -p > ui-sources.png
            adb shell pidof -s com.asterion.videoflow | grep -Eq "[0-9]+" || exit 1
            adb logcat -b crash -d > crash.log
            if grep -q "FATAL EXCEPTION" crash.log; then cat crash.log; exit 1; fi
      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: videoflow-ui-smoke-screens
          path: |
            ui-*.png
            crash.log
          if-no-files-found: warn
          retention-days: 7
