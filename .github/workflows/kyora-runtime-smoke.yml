name: Kyora Android 16 Runtime Smoke

on:
  pull_request:
  workflow_dispatch:

jobs:
  launch-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Assemble Kyora debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0660", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot emulator and validate Kyora UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am force-stop com.azrael.galleryflow
            adb shell am start -W -n com.azrael.galleryflow/.MainActivity
            sleep 3
            echo "=== Scheduler state ==="
            adb shell dumpsys jobscheduler | grep -E 'galleryflow|9811' | head -n 30 || true
            echo "=== Crash buffer ==="
            adb logcat -b crash -d || true
            echo "=== Application process ==="
            adb shell pidof -s com.azrael.galleryflow | grep -Eq '[0-9]+' || { echo 'Kyora crashed on launch'; exit 1; }
